<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Generate Simple Extension Icons</title>
  <style>
    body {
      font-family: system-ui;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 20px 0;
    }
    button:hover {
      background: #45a049;
    }
    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }
    .icon-item {
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Generate Extension Icons</h1>
  <p>Click the button below to generate and download all required icon sizes.</p>
  <p>Simple gradient with download arrow design.</p>
  
  <button onclick="generateAndDownload()">Generate All Icons</button>
  
  <div class="preview" id="preview"></div>

  <script>
    const sizes = [16, 32, 48, 128];
    
    function drawIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Draw download arrow
      ctx.strokeStyle = 'white';
      ctx.fillStyle = 'white';
      ctx.lineWidth = Math.max(2, size / 16);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      const centerX = size / 2;
      const centerY = size / 2;
      const arrowSize = size * 0.5;
      
      // Arrow shaft
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - arrowSize/3);
      ctx.lineTo(centerX, centerY + arrowSize/3);
      ctx.stroke();
      
      // Arrow head
      ctx.beginPath();
      ctx.moveTo(centerX - arrowSize/4, centerY + arrowSize/6);
      ctx.lineTo(centerX, centerY + arrowSize/3);
      ctx.lineTo(centerX + arrowSize/4, centerY + arrowSize/6);
      ctx.stroke();
      
      // Base line
      ctx.beginPath();
      ctx.moveTo(centerX - arrowSize/3, centerY + arrowSize/2);
      ctx.lineTo(centerX + arrowSize/3, centerY + arrowSize/2);
      ctx.stroke();
      
      return canvas;
    }
    
    function generateAndDownload() {
      const preview = document.getElementById('preview');
      preview.innerHTML = '';
      
      sizes.forEach(size => {
        const canvas = drawIcon(size);
        
        // Add to preview
        const div = document.createElement('div');
        div.className = 'icon-item';
        div.appendChild(canvas);
        const label = document.createElement('div');
        label.textContent = `${size}x${size}`;
        div.appendChild(label);
        preview.appendChild(div);
        
        // Download
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `icon${size}.png`;
          a.click();
          URL.revokeObjectURL(url);
        });
      });
    }
  </script>
</body>
</html>
