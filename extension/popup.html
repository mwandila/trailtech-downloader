<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trail Video Downloader (TVD)</title>
  <style>
    /* TVD palette — from the mwandila ticket-stub design system
       ink: #080D12/#0E161E/#15212C/#1E2F3D · line #23343F
       bone: #ffffff · gold: #F0B429/#B8791A · signal: #29B6F6
       mint: #1EB980 · flame: #EF4123 · mute: #93A6B4/#6B8090 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 232px;
      max-height: 410px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #080d12;
      color: #ffffff;
      scrollbar-width: thin;
      scrollbar-color: #b8791a #0e161e;
    }
    ::selection { background: #f0b429; color: #080d12; }
    ::-webkit-scrollbar { width: 9px; }
    ::-webkit-scrollbar-track { background: #0e161e; border-left: 1px solid #23343f; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(#b8791a, #7a5210);
      border: 2px solid #0e161e;
      border-radius: 99px;
    }
    .header {
      position: relative;
      background:
        linear-gradient(155deg, rgba(30, 47, 61, 0.95), rgba(14, 22, 30, 0.98));
      color: #ffffff;
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid #23343f;
      box-shadow: 0 1px 0 rgba(244, 239, 228, 0.06) inset;
    }
    .header::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -1px; height: 2px;
      background: linear-gradient(90deg, #f0b429, #ef4123 40%, #29b6f6 72%, #1eb980);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      color: #f0b429;
      text-shadow: 0 0 18px rgba(240, 180, 41, 0.35);
    }
    .status {
      font-size: 12px;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .status.connected { color: #1eb980; }
    .status.disconnected { color: #ef4123; }
    .content { padding: 8px; }
    .section {
      background:
        linear-gradient(155deg, rgba(30, 47, 61, 0.95), rgba(14, 22, 30, 0.98)),
        #0e161e;
      border: 1px solid #23343f;
      border-radius: 12px;
      padding: 9px;
      margin-bottom: 7px;
      box-shadow:
        0 1px 0 rgba(244, 239, 228, 0.06) inset,
        0 14px 34px -18px rgba(0, 0, 0, 0.9);
    }
    .section-title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .section-title::before {
      content: "◼ ";
      color: #f0b429;
      font-size: 9px;
      vertical-align: 2px;
    }
    .cookie-setting {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 12px;
      line-height: 1.35;
      color: #93a6b4;
    }
    .cookie-setting input { margin-top: 2px; accent-color: #f0b429; }
    .setting-note { margin: 6px 0 0 22px; font-size: 10px; line-height: 1.35; color: #6b8090; }    .download-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      background: rgba(41, 182, 246, 0.07);
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid #23343f;
      border-left: 3px solid #29b6f6;
    }
    #downloads-list { max-height: 224px; overflow-y: auto; }
    .download-item:last-child { margin-bottom: 0; }
    .download-info { flex: 1; min-width: 0; }
    .download-url {
      font-size: 12px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .download-progress {
      font-size: 11px;
      color: #6b8090;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      margin-top: 4px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1e2f3d;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #f0b429;
      box-shadow: 0 0 8px rgba(240, 180, 41, 0.55);
      transition: width 0.3s ease;
    }
    .progress-fill.indeterminate {
      animation: progress-pulse 1s ease-in-out infinite alternate;
    }
    @keyframes progress-pulse { from { opacity: .45; } to { opacity: 1; } }
    .download-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .download-action-button {
      padding: 4px 6px;
      border: 1px solid #23343f;
      border-radius: 4px;
      background: #0e161e;
      color: #93a6b4;
      font-size: 10px;
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }
    .download-action-button:hover { color: #ffffff; border-color: #b8791a; }
    .download-action-button:disabled {
      opacity: .55;
      cursor: default;
    }
    .empty-state {
      text-align: center;
      padding: 18px 12px;
      color: #6b8090;
      font-size: 12px;
    }
    .button {
      width: 100%;
      padding: 8px;
      background: #f0b429;
      color: #16110a;
      border: none;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, background .2s;
      box-shadow: 0 10px 28px -12px rgba(240, 180, 41, 0.75);
    }
    .button:hover {
      background: #d9a11f;
      transform: translateY(-2px);
      box-shadow: 0 14px 36px -12px rgba(240, 180, 41, 0.9);
    }
    .button:active { transform: translateY(0); }
    .input {
      width: 100%;
      padding: 10px;
      border: 1px solid #23343f;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
      background: #0e161e;
      color: #ffffff;
    }
    .input:focus {
      outline: none;
      border-color: #f0b429;
      box-shadow: 0 0 0 2px rgba(240, 180, 41, 0.25);
    }
    .select {
      width: 100%;
      padding: 7px;
      margin-bottom: 8px;
      border: 1px solid #23343f;
      border-radius: 6px;
      background: #0e161e;
      color: #ffffff;
      font-size: 13px;
    }
    .secondary-button {
      width: 100%;
      margin-bottom: 8px;
      padding: 6px;
      border: 1px solid #23343f;
      border-radius: 6px;
      background: rgba(14, 22, 30, 0.6);
      color: #93a6b4;
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }
    .secondary-button:hover { color: #ffffff; border-color: #29b6f6; }
  </style>
</head>
<body>
  <div class="header">
    <h1>TVD</h1>
    <div class="status" id="status">Connecting...</div>
  </div>

  <div class="content">
    <div class="section">
      <label class="cookie-setting"><input id="chrome-cookies" type="checkbox"><span>Use Chrome cookies if YouTube shows a bot check</span></label>
      <div class="setting-note">Uses your local Chrome session only after you enable it. YouTube may restrict accounts used with yt-dlp.</div>
    </div>
    <div class="section">
      <div class="section-title">Download Queue</div>
      <div id="downloads-list">
        <div class="empty-state">No active downloads</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
