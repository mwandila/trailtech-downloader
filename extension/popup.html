<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trail Video Downloader (TVD)</title>
  <style>
    /* TVD palette — from the mwandila ticket-stub design system.
       Dark theme (ink) is default; light theme (paper) follows the OS.
       ink: #080D12/#0E161E/#15212C/#1E2F3D · line #23343F
       bone: #F4EFE4 · paper: #F6F2E9/#EAE4D7 · gold: #F0B429/#B8791A
       signal: #29B6F6 · mint: #1EB980 · flame: #EF4123 · mute: #93A6B4/#6B8090 */
    :root {
      color-scheme: dark;
      --bg: #080d12;
      --surface: #0e161e;
      --surface-grad: linear-gradient(155deg, rgba(30, 47, 61, 0.95), rgba(14, 22, 30, 0.98));
      --line: #23343f;
      --text: #ffffff;
      --muted: #93a6b4;
      --muted-2: #6b8090;
      --gold: #f0b429;
      --gold-deep: #b8791a;
      --signal: #29b6f6;
      --mint: #1eb980;
      --flame: #ef4123;
      --track: #1e2f3d;
      --ink-text: #16110a;
      --on-gold: #16110a;
      --scroll-track: #0e161e;
      --item-bg: rgba(41, 182, 246, 0.07);
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f6f2e9;
        --surface: #fffdf7;
        --surface-grad: linear-gradient(155deg, #fffdf7, #f6f2e9);
        --line: #ddd5c6;
        --text: #080d12;
        --muted: #51666f;
        --muted-2: #6b8090;
        --gold: #f0b429;
        --gold-deep: #b8791a;
        --track: #eae4d7;
        --on-gold: #16110a;
        --scroll-track: #eae4d7;
        --item-bg: rgba(41, 182, 246, 0.08);
      }
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 232px;
      max-height: 410px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      scrollbar-width: thin;
      scrollbar-color: var(--gold-deep) var(--scroll-track);
    }
    ::selection { background: var(--gold); color: var(--bg); }
    ::-webkit-scrollbar { width: 9px; }
    ::-webkit-scrollbar-track { background: var(--scroll-track); border-left: 1px solid var(--line); }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--gold-deep), #7a5210);
      border: 2px solid var(--scroll-track);
      border-radius: 99px;
    }
    .header {
      position: relative;
      background: var(--surface-grad);
      color: var(--text);
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(244, 239, 228, 0.06) inset;
    }
    .header::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -1px; height: 2px;
      background: linear-gradient(90deg, #f0b429, #ef4123 40%, #29b6f6 72%, #1eb980);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(240, 180, 41, 0.35);
    }
    .status {
      font-size: 12px;
      font-family: ui-monospace, "SFMono-Regular", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .status.connected { color: var(--mint); }
    .status.disconnected { color: var(--flame); }
    .content { padding: 8px; }
    .section {
      background: var(--surface-grad);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px;
      margin-bottom: 7px;
      box-shadow:
        0 1px 0 rgba(244, 239, 228, 0.06) inset,
        0 14px 34px -18px rgba(0, 0, 0, 0.9);
    }
    .section-title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--text);
    }
    .section-title::before {
      content: "◼ ";
      color: var(--gold);
      font-size: 9px;
      vertical-align: 2px;
    }
    .cookie-setting {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
    }
    .cookie-setting input { margin-top: 2px; accent-color: var(--gold); }
    .setting-note { margin: 6px 0 0 22px; font-size: 10px; line-height: 1.35; color: var(--muted-2); }
    .download-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      background: var(--item-bg);
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--signal);
    }
    #downloads-list { max-height: 224px; overflow-y: auto; }
    .download-item:last-child { margin-bottom: 0; }
    .download-info { flex: 1; min-width: 0; }
    .download-url {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .download-progress {
      font-size: 11px;
      color: var(--muted-2);
      font-family: ui-monospace, "SFMono-Regular", monospace;
      margin-top: 4px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--track);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(240, 180, 41, 0.55);
      transition: width 0.3s ease;
    }
    .progress-fill.indeterminate {
      animation: progress-pulse 1s ease-in-out infinite alternate;
    }
    @keyframes progress-pulse { from { opacity: .45; } to { opacity: 1; } }
    .download-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .download-action-button {
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }
    .download-action-button:hover { color: var(--text); border-color: var(--gold-deep); }
    .download-action-button:disabled {
      opacity: .55;
      cursor: default;
    }
    .empty-state {
      text-align: center;
      padding: 18px 12px;
      color: var(--muted-2);
      font-size: 12px;
    }
    .button {
      width: 100%;
      padding: 8px;
      background: var(--gold);
      color: var(--on-gold);
      border: none;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, background .2s;
      box-shadow: 0 10px 28px -12px rgba(240, 180, 41, 0.75);
    }
    .button:hover {
      background: #d9a11f;
      transform: translateY(-2px);
      box-shadow: 0 14px 36px -12px rgba(240, 180, 41, 0.9);
    }
    .button:active { transform: translateY(0); }
    .input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
      background: var(--surface);
      color: var(--text);
    }
    .input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(240, 180, 41, 0.25);
    }
    .select {
      width: 100%;
      padding: 7px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
    }
    .secondary-button {
      width: 100%;
      margin-bottom: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: color .2s ease, border-color .2s ease;
    }
    .secondary-button:hover { color: var(--text); border-color: var(--signal); }
  </style>
</head>
<body>
  <div class="header">
    <h1>TVD</h1>
    <div class="status" id="status">Connecting...</div>
  </div>

  <div class="content">
    <div class="section">
      <label class="cookie-setting"><input id="chrome-cookies" type="checkbox"><span>Use Chrome cookies if YouTube shows a bot check</span></label>
      <div class="setting-note">Uses your local Chrome session only after you enable it. YouTube may restrict accounts used with yt-dlp.</div>
    </div>
    <div class="section">
      <div class="section-title">Download Queue</div>
      <div id="downloads-list">
        <div class="empty-state">No active downloads</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
